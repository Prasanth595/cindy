<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>overlay-smoke</title>
  <style>
    /* 零桥浮窗：页面底色必须完全透明，透明由「宿主透明窗 + 页面透明」共同决定。 */
    html,
    body {
      margin: 0;
      width: 160px;
      height: 160px;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    #dot {
      position: absolute;
      /* 96×96 圆，圆心居中在 (80, 80)，半径 48。 */
      left: 32px;
      top: 32px;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(64, 128, 255, 0.45); /* 半透明蓝 */
    }
    #status {
      position: absolute;
      left: 8px;
      bottom: 8px;
      width: 144px;
      box-sizing: border-box;
      padding: 2px 4px;
      font: 11px/1.4 system-ui, "Segoe UI", sans-serif;
      color: #0b2545;
      text-align: center;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 6px;
      pointer-events: none; /* 状态块不参与命中/点击，不挡圆外穿透判定。 */
    }
  </style>
</head>
<body>
  <div id="dot"></div>
  <div id="status">hit: no · click: 0 · (—, —)</div>
  <script>
    // 零桥页面：严禁引用 window.cindy 或任何 preload 能力。
    // 与电子脑同源，命中判定结果只经 BroadcastChannel 交给电子脑转发。
    (function () {
      'use strict';

      const CHANNEL = 'overlay-smoke';
      const channel = new BroadcastChannel(CHANNEL);

      const CX = 80; // 圆心 x
      const CY = 80; // 圆心 y
      const R = 48;  // 半径（96 / 2）

      let clickCount = 0;
      let lastX = 0;
      let lastY = 0;
      const status = document.getElementById('status');

      function isInsideCircle(x, y) {
        const dx = x - CX;
        const dy = y - CY;
        return dx * dx + dy * dy <= R * R;
      }

      function postInteractive(interactive) {
        channel.postMessage({ type: 'overlay-interactive', interactive: interactive });
      }

      function renderStatus(hit) {
        status.textContent =
          'hit: ' + (hit ? 'yes' : 'no') +
          ' · click: ' + clickCount +
          ' · (' + lastX + ', ' + lastY + ')';
      }

      document.addEventListener('mousemove', (event) => {
        lastX = event.clientX;
        lastY = event.clientY;
        const hit = isInsideCircle(lastX, lastY);
        postInteractive(hit);
        renderStatus(hit);
      });

      document.addEventListener('click', () => {
        // 穿透态（圆外）点击不会到达本页；能到这里说明命中圆且已 set-interactive(true)。
        clickCount += 1;
        renderStatus(true);
      });
    })();
  </script>
</body>
</html>
