name: Windows remote desktop native

on:
  pull_request:
    paths:
      - '.github/workflows/windows-remote-desktop-native.yml'
      - 'apps/desktop/native/remote-desktop/windows-host/**'
      - 'apps/desktop/native/remote-desktop/windows-input/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/windows-remote-desktop-native.yml'
      - 'apps/desktop/native/remote-desktop/windows-host/**'
      - 'apps/desktop/native/remote-desktop/windows-input/**'

permissions:
  contents: read

concurrency:
  group: windows-remote-desktop-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  native-tests:
    name: Windows remote desktop Rust tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js for development test identity
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build packaged host
        run: cargo build --locked --bins --manifest-path apps/desktop/native/remote-desktop/windows-host/Cargo.toml

      - name: Test packaged host
        run: cargo test --locked --bins --manifest-path apps/desktop/native/remote-desktop/windows-host/Cargo.toml -- --test-threads=1

      - name: Bind development test paths
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $application = (Resolve-Path 'apps/desktop').Path
          $executable = (Get-Command node.exe).Source
          "CINDY_DESKTOP_DEV_APP=$application" >> $env:GITHUB_ENV
          "CINDY_DESKTOP_DEV_EXECUTABLE=$executable" >> $env:GITHUB_ENV

      - name: Build development host
        if: ${{ !cancelled() }}
        run: cargo build --locked --bins --features development --manifest-path apps/desktop/native/remote-desktop/windows-host/Cargo.toml

      - name: Test development host
        if: ${{ !cancelled() }}
        run: cargo test --locked --bins --features development --manifest-path apps/desktop/native/remote-desktop/windows-host/Cargo.toml -- --test-threads=1

      - name: Build input helper
        if: ${{ !cancelled() }}
        run: cargo build --locked --bins --manifest-path apps/desktop/native/remote-desktop/windows-input/Cargo.toml

      - name: Test input helper
        if: ${{ !cancelled() }}
        run: cargo test --locked --bins --manifest-path apps/desktop/native/remote-desktop/windows-input/Cargo.toml
