name: Open With Windows Test Package

on:
  push:
    branches:
      - feature/md-open-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout test branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and smoke-test Windows installer
        run: pnpm release:package --platform win32 --arch x64 --region global --no-sign

      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: cindy-open-with-windows-x64
          path: |
            apps/desktop/release/artifacts/global/unversioned/win32-x64/*.exe
            apps/desktop/release/artifacts/global/unversioned/win32-x64/build-info.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
